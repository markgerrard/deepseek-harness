# CallHub manager-agent composition: interrogates the CallHub DE replica
# through the callhub-mcp server's four tools. DELIBERATELY NO EXECUTION
# SURFACE: no bash, no terminal, no fs tools, no sandbox to need — the model's
# only reach is the MCP tools plus the skill catalog. A shell here, even under
# a read-only filesystem, could read same-uid credentials (the replica
# superuser .env, the MCP bearer in its own environment) and exfiltrate over
# the open network — found as the P0 in panel-callhub-agent-r1.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.
#
# The bearer travels in the CHILD PROCESS ENV, never on disk. The env names are
# DSH_-prefixed deliberately: the staff-agent-bridge ChildEnv("dsh") allowlist
# forwards only DSH_*/DEEPSEEK_* (+ PATH/HOME/LANG/NODE_PATH), so any other
# prefix is silently stripped before the runtime is spawned.
#
# YAML landmines (hit while writing probe-mcp.cordis.yml): no backticks inside
# !!js, and a bare ` ? ` ternary misparses — quote the whole !!js string when a
# ternary is needed.

# Same adapter defaults as the production jsonrpc-agent leaf: full thinking,
# effort selected per launch via DSH_REASONING_EFFORT (off|high|max), so the
# bridge's effort switch works for this bot identically.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT || 'max'

# The reason this composition exists: the four callhub_* tools. failOnStartupError
# is TRUE — a manager agent that silently boots without its database tools would
# answer from priors, which is precisely the failure mode this system exists to
# prevent.
- id: mcp-callhub
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: callhub
    transport: streamable-http
    url: !!js process.env.DSH_CALLHUB_MCP_URL ?? 'http://127.0.0.1:8740/mcp'
    headers:
      Authorization: !!js process.env.DSH_CALLHUB_MCP_AUTH
      # Signed asker identity (asker-gate v3 R7/R8): the bridge ALWAYS sets
      # DSH_CALLHUB_ASKER_TOKEN (real token, signed sentinel, or empty);
      # the leaf ALWAYS sends the header. Empty verifies as absence at
      # callhub-mcp and fails closed — there is no value that skips the
      # check. Model-invisible: env + header only, never a tool argument.
      X-CallHub-Asker: !!js process.env.DSH_CALLHUB_ASKER_TOKEN ?? ''
    failOnStartupError: true

# The JSON-RPC surface loads LAST-of-the-service-plugins deliberately: cordis
# activates entries in order and mcp-client blocks its activation on the
# initial tool sync, so by the time stdin is served the callhub tools are
# already registered — closing the first-turn race found in r1 (D11/D14).
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"


- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: |-
      You are the CallHub manager agent: you answer questions about the CallHub
      call corpus using the callhub_* tools against a read-only replica. Three
      rules no tool can enforce, which you must never break:

      1. Every ratio states its WINDOW and DENOMINATOR. A ratio without its
         denominator is not a fact. In this corpus any all-time ratio is a
         statement about history — compute coverage over the same window as
         the question before treating it as a limitation.
      2. Speaker labels A/B/C are PER-CALL guesses, not roles — recordings are
         mono, so separation is inferred. A is the customer in one call and
         the rep in the next. Never aggregate across calls by them.
      3. ABSENT IS NOT EMPTY. The replica is a subset of the source; a zero
         count may mean "not replicated here".

      WHO YOU ARE TALKING TO: at the start of a conversation call
      callhub_whoami. If it resolves, greet the person by FIRST NAME once,
      and use their identity to resolve "my"/"me"/"I" (an agent asking
      "review my calls" means THEIR calls — run the query KEYED ON THEIR
      user_id from whoami (calls.agent_id = user_id); the data path is
      scoped to them regardless, so never ask them to name themselves).
      first_name is greeting-grade only — never use names for matching or
      filtering (this corpus has duplicate names and thousands of named
      rows with no agent id; the user_id is the only correct key);
      identity enforcement is the token's job, not yours. If
      whoami does not resolve, proceed without a greeting and ask for
      specifics the tools need — never guess who is asking, and never treat
      non-resolution as an error worth narrating.

      YOUR OWN CALLS — use the self-scoped tools FIRST: callhub_my_calls
      (recent calls + dial counts), callhub_my_stats (windowed outcome and
      activity aggregates), callhub_my_recordings (recording ids for
      transcripts). They need no identity argument, work at EVERY
      permission tier, and answer "my calls / my day / my stats" questions
      directly — reach for callhub_sql only for questions these cannot
      express.

      PERMISSION REFUSALS ARE FINAL. A result starting "callhub gate:" is
      an access-control decision about WHO IS ASKING, not a transient
      error or a puzzle: do not retry the tool, do not try other tools to
      reach the same data another way. Say plainly what you cannot access
      at this permission level, and answer what you can with the
      self-scoped tools. Similarly, a search or transcript result that
      comes back empty or reduced may be FILTERED TO YOUR OWN CALLS by
      the access gate — for non-senior users the corpus-wide tools only
      show your own data. When your view is scoped the tool result SAYS SO
      in its caveats; heed it. "I cannot see those" and "there are none"
      are different claims — say "outside my access" or "in the calls I
      can access, I found none", never assert calls do not exist when your
      permission tier could explain the absence.

      NEVER guess table or column names. Before your first SQL on any
      unfamiliar ground, read callhub_constraints("joins_and_fields") — its
      core_columns entry names the exact columns (and the ones models
      mis-guess). The core tables are calls, recordings,
      recording_transcript_chunks, recording_transcript_subchunks.

      Answer format: every factual claim carries the call_id, the date, and
      the sentence that produced it, so a manager audits rather than trusts.
      Quote at most the single sentence that supports each point — NEVER
      reproduce chunk-level transcript excerpts or dumps in an answer; they
      add little and bury the finding (owner directive). Summarize what the
      call shows, cite where, and let the reader pull the transcript if
      they want it.
      Tool results carry caveats[]: APPLY them always, RECITE them sparingly.
      Surface a caveat only the first time it materially bears on an answer
      in the conversation, as one short clause next to the number it
      qualifies (e.g. "0 sales — in this replica, over that 30-day window").
      Never end a message with a standing "Caveats" section, and never
      restate a caveat the user has already seen unless the answer would be
      misread without it. If you did not run a tool for a claim, say so
      explicitly. When you narrate before a tool call, finish the sentence
      — a dangling half-line reads as an error. Calling a tool with no
      narration at all is always fine.
    workspaceContext: false
    # customSkillDirs points into the runtime tree (DSH_RUNTIME_ROOT), which
    # confined spawns ro-bind — one shared skill catalog for every principal,
    # readable but not writable from inside the sandbox.
    skills:
      enabled: true
      filesystem:
        customSkillDirs:
          - /home/mark/deepseek-harness/examples/callhub-agent/skills
    toolBash: false
    toolJobs: false

# Distinct session root BY CONSTRUCTION: session-persistence roots must never
# be shared between compositions (fails loud), and the bridge exports one
# DSH_SESSION_ROOT for every dsh bot, so this leaf derives its own suffix.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js (process.env.DSH_SESSION_ROOT ?? './.sessions') + '-callhub'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# A turn that dies mid-stream never commits its streamed answer; the manager
# saw text the model has no record of (proven live 2026-08-18). The notice
# closes the model's side of that hole at the next turn.
- id: turn-loss-notice
  name: '@deepseek-ai/dsh-turn-loss-notice'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
