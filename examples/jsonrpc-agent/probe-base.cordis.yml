# Probe overlay: the stock jsonrpc composition, with only the model catalog
# widened so an OpenAI-compatible gateway (DEEPSEEK_BASE_URL) can serve an
# arbitrary model id. Everything else is cordis.yml as shipped.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        config:
          apiKeyEnv: DEEPSEEK_API_KEY
          models:
            - id: !!js process.env.DSH_MODEL
              contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
