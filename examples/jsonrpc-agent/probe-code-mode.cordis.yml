# Probe overlay: the jsonrpc composition with Code Mode enabled, so the SDK
# wire carries tool/code-dispatch instead of one tool/call per action.
# A config patch replaces the whole plugin config, so unchanged base fields
# from cordis.yml are restated here.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      # Declare an arbitrary model id so an OpenAI-compatible gateway
      # (e.g. OpenRouter via DEEPSEEK_BASE_URL) resolves.
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        config:
          apiKeyEnv: DEEPSEEK_API_KEY
          models:
            - id: !!js process.env.DSH_MODEL
              contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
          workspaceContext: false
          skills:
            enabled: false
          toolBash:
            enableRunInBackground: false
          toolJobs: false
          tools:
            mode: code
      - insert:
          - id: code-runtime
            name: '@deepseek-ai/dsh-code-runtime-worker-thread'
